# Site settings
title: Sustainability Science
description: A resource for sustainability science research and teaching. Currently supported by Harvard Kennedy School's Sustainability Science Program.
url: "https://sustainabilityscience.org"
baseurl: ""

# Author info (for SEO)
author:
  name: Alicia G. Harley & William C. Clark

# Social (for Open Graph)
social:
  name: Sustainability Science Program
  
# Plugins
plugins:
  - jekyll-sitemap

# Build settings
markdown: kramdown
highlighter: rouge

# Collections for blog posts
collections:
  posts:
    output: true
    permalink: /theorist/:year/:month/:title/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: "theorist/_posts"
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "course"
    values:
      layout: "course"

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .DS_Store
