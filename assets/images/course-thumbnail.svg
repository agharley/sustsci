<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background - deep navy to match Earth at night -->
  <rect width="300" height="300" fill="#0f1e2a"/>
  
  <!-- Nature circle (left) - significant overlap -->
  <circle cx="115" cy="150" r="90" fill="none" stroke="#3a7868" stroke-width="2" opacity="0.8"/>
  
  <!-- Society circle (right) - significant overlap -->
  <circle cx="185" cy="150" r="90" fill="none" stroke="#5a9888" stroke-width="2" opacity="0.8"/>
  
  <!-- Elements spread nicely in overlap -->
  <!-- Top - gold accent -->
  <circle cx="150" cy="85" r="6" fill="#d4a85a" opacity="0.85"/>
  <!-- Upper left -->
  <circle cx="115" cy="120" r="5" fill="#6aaa9a" opacity="0.7"/>
  <!-- Upper right -->
  <circle cx="185" cy="120" r="5" fill="#6aaa9a" opacity="0.7"/>
  <!-- Center - gold accent for pop -->
  <circle cx="150" cy="150" r="8" fill="#c9a86a" opacity="0.9"/>
  <!-- Lower left -->
  <circle cx="115" cy="180" r="5" fill="#6aaa9a" opacity="0.7"/>
  <!-- Lower right -->
  <circle cx="185" cy="180" r="5" fill="#6aaa9a" opacity="0.7"/>
  <!-- Bottom - gold accent -->
  <circle cx="150" cy="215" r="6" fill="#d4a85a" opacity="0.85"/>
  
  <!-- Subtle connections -->
  <line x1="150" y1="85" x2="150" y2="150" stroke="#c9a86a" stroke-width="1" opacity="0.3"/>
  <line x1="150" y1="215" x2="150" y2="150" stroke="#c9a86a" stroke-width="1" opacity="0.3"/>
  <line x1="115" y1="120" x2="185" y2="180" stroke="#8ec8b8" stroke-width="1" opacity="0.2"/>
  <line x1="185" y1="120" x2="115" y2="180" stroke="#8ec8b8" stroke-width="1" opacity="0.2"/>
  
</svg>
