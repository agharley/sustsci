<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background - deep navy -->
  <rect width="32" height="32" fill="#0f1e2a"/>

  <!-- Nature circle (left) - deeper teal -->
