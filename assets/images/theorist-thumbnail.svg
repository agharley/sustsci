<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- Background - very dark warm -->
  <rect width="300" height="300" fill="#15120f"/>
  
  <!-- Globe -->
  <circle cx="130" cy="160" r="55" fill="none" stroke="#8a7a5a" stroke-width="2" opacity="0.8"/>
  <!-- Globe meridian -->
  <ellipse cx="130" cy="160" rx="22" ry="55" fill="none" stroke="#8a7a5a" stroke-width="1.5" opacity="0.45"/>
  <!-- Globe equator -->
  <ellipse cx="130" cy="160" rx="55" ry="18" fill="none" stroke="#8a7a5a" stroke-width="1.5" opacity="0.45"/>
  
  <!-- Prism overlapping globe - golden -->
  <polygon points="175,70 240,190 110,190" fill="none" stroke="#c8b080" stroke-width="2" opacity="0.85"/>
  
  <!-- Small accent dots - bright gold for illumination -->
  <circle cx="150" cy="120" r="4" fill="#e8c878" opacity="0.9"/>
  <circle cx="175" cy="160" r="4" fill="#d4b888" opacity="0.85"/>
  <circle cx="130" cy="190" r="4" fill="#e8d098" opacity="0.85"/>
  
</svg>
