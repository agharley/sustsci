<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <!-- Background - very dark warm -->
  <rect width="1200" height="300" fill="#15120f"/>
  
  <!-- Globe - positioned left of center -->
  <circle cx="480" cy="150" r="80" fill="none" stroke="#8a7a5a" stroke-width="2" opacity="0.7"/>
  <!-- Globe meridian -->
  <ellipse cx="480" cy="150" rx="32" ry="80" fill="none" stroke="#8a7a5a" stroke-width="1.5" opacity="0.4"/>
  <!-- Globe equator -->
  <ellipse cx="480" cy="150" rx="80" ry="26" fill="none" stroke="#8a7a5a" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Prism overlapping globe - shifted right -->
  <polygon points="560,50 680,250 440,250" fill="none" stroke="#c8b080" stroke-width="2" opacity="0.8"/>
  
  <!-- Accent dots at intersection points -->
  <circle cx="520" cy="100" r="5" fill="#e8c878" opacity="0.9"/>
  <circle cx="580" cy="150" r="5" fill="#d4b888" opacity="0.85"/>
  <circle cx="500" cy="220" r="5" fill="#e8d098" opacity="0.85"/>
  
  <!-- Additional subtle decorative elements for width -->
  <!-- Left side subtle circles -->
  <circle cx="150" cy="150" r="40" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.3"/>
  <circle cx="250" cy="120" r="25" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.25"/>
  
  <!-- Right side subtle elements -->
  <circle cx="850" cy="150" r="35" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.25"/>
  <circle cx="950" cy="180" r="20" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="130" r="30" fill="none" stroke="#6a5a4a" stroke-width="1" opacity="0.2"/>
  
  <!-- Small gold accent dots scattered -->
  <circle cx="180" cy="100" r="3" fill="#d4b888" opacity="0.5"/>
  <circle cx="320" cy="200" r="3" fill="#d4b888" opacity="0.4"/>
  <circle cx="780" cy="100" r="3" fill="#d4b888" opacity="0.5"/>
  <circle cx="920" cy="220" r="3" fill="#d4b888" opacity="0.4"/>
  <circle cx="1000" cy="80" r="3" fill="#d4b888" opacity="0.3"/>
  
</svg>
