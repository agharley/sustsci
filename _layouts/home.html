<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }} | Resources for Research and Teaching</title>
  <meta name="description" content="{{ site.description }}">
  
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ '/course/images/NASA_earth_at_night.jpg' | absolute_url }}">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ site.title }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:image" content="{{ '/course/images/NASA_earth_at_night.jpg' | absolute_url }}">
  
  <!-- Canonical -->
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <!-- Earth at Night Banner (large, first) -->
  <header class="earth-banner earth-banner-large">
    <div class="earth-banner-inner">
      <h1>Sustainability Science</h1>
      <p>Resources for research and teaching on sustainable development</p>
    </div>
  </header>

  <nav class="site-header">
    <div class="site-header-inner">
      <a href="{{ '/' | relative_url }}" class="site-title">Sustainability Science</a>
      <nav class="site-nav">
        <a href="{{ '/course/' | relative_url }}">Course</a>
        <a href="{{ '/c4sd/' | relative_url }}">C4SD</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/keeping-up/' | relative_url }}">Keeping Up</a>
      </nav>
    </div>
  </nav>

  <main class="page-container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} <a href="https://scholar.harvard.edu/aharley">Alicia C. Harley</a> & William C. Clark</p>
    <p><a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p>
  </footer>
</body>
</html>
