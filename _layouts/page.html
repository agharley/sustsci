---
layout: default
---

<main id="main-content" class="page-container{% if page.wide %} page-container-wide{% endif %}{% if page.full %} page-container-full{% endif %}">
  {% if page.title %}
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </header>
  {% endif %}
  
  <div class="page-content">
    {{ content }}
  </div>
</main>
