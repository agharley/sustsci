<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{{ '/course/images/NASA_earth_at_night.jpg' | absolute_url }}">
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ '/course/images/NASA_earth_at_night.jpg' | absolute_url }}">
  
  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <!-- Small Earth at Night Banner -->
  <header class="earth-banner earth-banner-small">
    <div class="earth-banner-inner">
      <h1>{{ page.title }}</h1>
    </div>
  </header>

  <nav class="site-header">
    <div class="site-header-inner">
      <a href="{{ '/' | relative_url }}" class="site-title">Sustainability Science</a>
      <nav class="site-nav">
        <a href="{{ '/course/' | relative_url }}" {% if page.url contains '/course' %}class="active"{% endif %}>Course</a>
        <a href="{{ '/c4sd/' | relative_url }}" {% if page.url contains '/c4sd' %}class="active"{% endif %}>C4SD</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a>
        <a href="{{ '/keeping-up/' | relative_url }}" {% if page.url contains '/keeping-up' %}class="active"{% endif %}>Keeping Up</a>
      </nav>
    </div>
  </nav>

  <main class="page-container">
    {% if page.subtitle %}
    <p class="page-subtitle" style="margin-top: 0; margin-bottom: 1.5rem;">{{ page.subtitle }}</p>
    {% endif %}
    
    <div class="page-content">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <p>© {{ 'now' | date: "%Y" }} <a href="https://scholar.harvard.edu/aharley">Alicia C. Harley</a> & William C. Clark</p>
    <p><a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p>
  </footer>
</body>
</html>
