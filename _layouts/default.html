<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% assign seo = page.seo_title | default: page.title %}{% if seo %}{{ seo }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- Open Graph / Social -->
  <meta property="og:type" content="{% if page.layout == 'blog' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% assign seo = page.seo_title | default: page.title %}{% if seo %}{{ seo }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/course/images/NASA_earth_at_night.jpg' | absolute_url }}{% endif %}">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% assign seo = page.seo_title | default: page.title %}{% if seo %}{{ seo }} | {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ '/course/images/NASA_earth_at_night.jpg' | absolute_url }}{% endif %}">

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  {% if page.layout == 'blog' %}
  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "description": {{ page.description | default: site.description | jsonify }},
    "url": "{{ page.url | absolute_url }}",
    "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ page.url | absolute_url }}" },
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
    "author": { "@type": "Person", "name": {{ page.author | default: "Alicia G. Harley" | jsonify }}, "url": "{{ '/about/' | absolute_url }}" },
    "publisher": { "@type": "Organization", "name": {{ site.title | jsonify }}, "url": "{{ '/' | absolute_url }}" }{% if page.image %},
    "image": "{{ page.image | absolute_url }}"{% endif %}{% if page.keywords %},
    "keywords": {{ page.keywords | jsonify }}{% endif %}
  }
  </script>
  {% endif %}

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="site-title">Sustainability Science</a>
      <ul class="nav-links">
        <li><a href="{{ '/course/' | relative_url }}" {% if page.url contains '/course' %}class="active"{% endif %}>Course</a></li>
        <li><a href="{{ '/c4sd/' | relative_url }}" {% if page.url contains '/c4sd' %}class="active"{% endif %}>C4SD</a></li>
        <li><a href="{{ '/theorist/' | relative_url }}" {% if page.url contains '/theorist' %}class="active"{% endif %}>Theorist</a></li>
        <li><a href="{{ '/keeping-up/' | relative_url }}" {% if page.url contains '/keeping-up' %}class="active"{% endif %}>Keeping Up</a></li>
        <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>About</a></li>
      </ul>
    </nav>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="footer-content">
      <p>© {{ 'now' | date: "%Y" }} Alicia G. Harley & William C. Clark</p>
    </div>
  </footer>
</body>
</html>
