---
layout: default
---

<main class="page-container">
  <article class="post">
    <header class="page-header">
      <h1>{{ page.title }}</h1>
      <p class="post-meta">
        {{ page.date | date: "%B %-d, %Y" }}{% if page.author %} · {{ page.author }}{% endif %}
      </p>
    </header>
    
    <div class="post-content">
      {{ content }}
    </div>
    
    <footer style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #dfe6e9;">
      <a href="{{ '/blog/' | relative_url }}">← Back to Blog</a>
    </footer>
  </article>
</main>
